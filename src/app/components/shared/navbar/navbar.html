<aside class="fixed inset-y-0 left-0 z-50 w-64 bg-[#181818] border-r border-[#303030] flex flex-col no-print">
  <!-- Brand Header -->
  <div class="flex items-center gap-3 px-6 py-5 border-b border-[#303030]">
    <div class="w-9 h-9 bg-[#da291c] flex items-center justify-center font-black text-white text-sm tracking-tighter">
      LC
    </div>
    <div>
      <p class="text-white font-bold text-sm uppercase tracking-tight leading-none">LifeCare</p>
      <p class="text-[#da291c] text-[10px] font-semibold uppercase tracking-[1.1px] mt-0.5">Medical Lab</p>
    </div>
  </div>

  <!-- Navigation Menu -->
  <nav class="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto">
    <p class="text-[#969696] text-[11px] font-bold uppercase tracking-[1.1px] px-3 mb-3">Staff Navigation</p>

    <a routerLink="/dashboard" routerLinkActive="bg-[#da291c] text-white"
      [routerLinkActiveOptions]="{exact:true}"
      class="flex items-center gap-3 px-3.5 py-3 text-[#969696] hover:text-white hover:bg-[#303030] text-xs font-bold uppercase tracking-[1.1px] transition-all">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span>Dashboard</span>
    </a>

    <a routerLink="/patients" routerLinkActive="bg-[#da291c] text-white"
      [routerLinkActiveOptions]="{exact:true}"
      class="flex items-center gap-3 px-3.5 py-3 text-[#969696] hover:text-white hover:bg-[#303030] text-xs font-bold uppercase tracking-[1.1px] transition-all">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
      </svg>
      <span>All Patients</span>
    </a>

    <a routerLink="/patients/new" routerLinkActive="bg-[#da291c] text-white"
      class="flex items-center gap-3 px-3.5 py-3 text-[#969696] hover:text-white hover:bg-[#303030] text-xs font-bold uppercase tracking-[1.1px] transition-all">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>New Patient</span>
    </a>

    <a routerLink="/"
      class="flex items-center gap-3 px-3.5 py-3 text-[#969696] hover:text-white hover:bg-[#303030] text-xs font-bold uppercase tracking-[1.1px] transition-all">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
      </svg>
      <span>Public Site</span>
    </a>

    @if (isAdmin()) {
    <div class="pt-6">
      <p class="text-[#969696] text-[11px] font-bold uppercase tracking-[1.1px] px-3 mb-2">Authority</p>
      <div class="flex items-center gap-2 px-3.5 py-2.5 bg-[#303030] text-[#da291c] text-xs font-bold uppercase tracking-[1.1px]">
        <span class="w-2 h-2 bg-[#da291c]"></span>
        <span>Admin Mode</span>
      </div>
    </div>
    }
  </nav>

  <!-- Staff Info Footer -->
  @if (staff()) {
  <div class="px-4 py-4 border-t border-[#303030]">
    <div class="p-3 bg-[#303030] mb-2">
      <p class="text-white text-xs font-bold uppercase truncate">{{ staff()!.name }}</p>
      <p class="text-[#969696] text-[11px] uppercase tracking-wider truncate">{{ staff()!.role }}</p>
    </div>
    <button (click)="logout()"
      class="w-full flex items-center justify-center gap-2 px-3 py-2.5 bg-transparent border border-[#404040] hover:border-[#da291c] text-[#969696] hover:text-[#da291c] text-xs font-bold uppercase tracking-[1.1px] transition-all">
      <span>Sign Out</span>
    </button>
  </div>
  }
</aside>
